# Experiment configuration for DR stage detection.
# Paths are relative to the project root unless absolute.
# Any value can be overridden on Kaggle by setting the DR_DATA_ROOT
# environment variable (see src/utils/config.py).

seed: 42

paths:
  # Folder that contains the extracted Kaggle dataset.
  # Locally: data/raw
  # Kaggle Notebook: /kaggle/input/diabetic-retinopathy-2015-data-colored-resized
  data_root: data/raw
  splits_dir: data/splits
  # Cache of preprocessed images. On Kaggle this defaults to /kaggle/temp/processed
  # (fast local disk, not included in the notebook output).
  processed_dir: data/processed
  models_dir: models
  figures_dir: outputs/figures
  logs_dir: outputs/logs
  metrics_dir: outputs/metrics

data:
  # Optional labels CSV inside data_root (columns: image, level).
  # If it is not found, labels are taken from the class folder names.
  labels_csv: trainLabels.csv
  image_extensions: [".png", ".jpg", ".jpeg"]
  num_classes: 5
  class_names: ["No DR", "Mild", "Moderate", "Severe", "Proliferative DR"]
  # Folder names used by the Kaggle dataset, mapped to stage labels.
  folder_to_label:
    No_DR: 0
    Mild: 1
    Moderate: 2
    Severe: 3
    Proliferate_DR: 4

split:
  # Patient-level stratified split (both eyes of a patient stay together).
  train: 0.70
  val: 0.15
  test: 0.15

image:
  size: 224
  # ImageNet statistics, used because the backbones are ImageNet-pretrained.
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

preprocessing:
  crop_black_border: true
  border_threshold: 4         # minimum retina/background threshold; the actual
                              # value adapts per image (20% of its bright level)
  clahe: true
  clahe_clip_limit: 2.0
  clahe_tile_grid: 8
  ben_graham: true
  ben_graham_sigma: 10        # Gaussian sigma for blur subtraction
  denoise: median             # median | bilateral | none
  denoise_kernel: 3

augmentation:
  # Applied to the TRAINING set only, on the preprocessed image.
  rotate_limit: 180           # fundus photos have no fixed "up", any angle is valid
  scale: [0.9, 1.1]           # zoom in / out by up to 10%
  translate: 0.05             # shift by up to 5% of the image size
  hflip: 0.5
  vflip: 0.5
  brightness: 0.2             # +/-20% brightness
  contrast: 0.2               # +/-20% contrast
  hue_shift: 5                # small colour shifts (camera differences)
  sat_shift: 10
  p_color: 0.5                # probability of applying the colour changes

training:
  backbone: efficientnet_b0   # efficientnet_b0 | resnet50 | mobilenetv3_large_100
  pretrained: true
  batch_size: 32
  num_workers: 4
  # Stage 1: backbone frozen, train the classification head only.
  head_epochs: 3
  head_lr: 1.0e-3
  # Stage 2: unfreeze and fine-tune the whole network.
  finetune_epochs: 20
  finetune_lr: 1.0e-4
  weight_decay: 1.0e-4
  dropout: 0.3
  label_smoothing: 0.05
  optimizer: adamw
  scheduler: cosine           # cosine | plateau
  early_stopping_patience: 5
  monitor: val_qwk            # metric used for early stopping and best checkpoint
  balancing: class_weights    # class_weights | sampler | none
  # Weight of class c = (N / (K * n_c)) ** balance_power.
  # 1.0 = full inverse frequency (36x for Proliferative), 0.5 = square root (6x).
  balance_power: 0.5
  amp: true
  cache_images: true          # preprocess every image once and reuse it each epoch

evaluation:
  # Screening operating point: threshold on P(DR) = 1 - P(No DR), chosen on the
  # validation set to reach this sensitivity, then applied unchanged to the test set.
  target_sensitivity: 0.80
